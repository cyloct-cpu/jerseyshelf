server {
    listen 80;
    server_name jerseyshelf.com www.jerseyshelf.com;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/jerseyshelf-acme;
        default_type text/plain;
    }
    location / { return 301 https://jerseyshelf.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.jerseyshelf.com;
    ssl_certificate /etc/letsencrypt/live/jerseyshelf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jerseyshelf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://jerseyshelf.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jerseyshelf.com;
    ssl_certificate /etc/letsencrypt/live/jerseyshelf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jerseyshelf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/jerseyshelf/access.log;
    error_log /www/wwwlogs/jerseyshelf/error.log;
    client_max_body_size 16m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
